name: API Tests

on:
  push:
    branches:
      - main
      - master
      - '**'
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/api-tests.yml'
  pull_request:
    branches: [ main, master ]
  workflow_run:
    workflows: ["Docker Build and Push"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run tests against'
        required: true
        default: 'docker'
        type: choice
        options:
          - local
          - docker
      test_folder:
        description: 'Test folder to run (leave empty for all)'
        required: false
        type: string

jobs:
  api-tests:
    name: Run API Tests
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}

      - name: Set up Docker Compose
        run: |
          docker compose --version
      
      - name: Start services with Docker Compose
        run: |
          docker compose up -d
      
      - name: Check container status
        run: |
          echo "Container status:"
          docker compose ps
          echo ""
          echo "Checking for failed containers..."
          docker compose ps | grep -i "exited\|error\|unhealthy" || echo "No failed containers found"
      
      - name: Wait for services to be ready
        run: |
          echo "Waiting for services to be ready..."
          
          # Функция для проверки health check
          check_health() {
            local url=$1
            local service_name=$2
            local max_attempts=60
            local attempt=1
            local wait_time=5
            
            echo "Checking $service_name health at $url"
            
            while [ $attempt -le $max_attempts ]; do
              if curl -f -s "$url" > /dev/null 2>&1; then
                echo "✅ $service_name is ready!"
                return 0
              fi
              
              echo "⏳ Attempt $attempt/$max_attempts: $service_name not ready yet, waiting ${wait_time}s..."
              sleep $wait_time
              attempt=$((attempt + 1))
            done
            
            echo "❌ $service_name failed to become ready after $((max_attempts * wait_time)) seconds"
            return 1
          }
          
          # Функция для проверки готовности PostgreSQL
          check_postgres() {
            local max_attempts=30
            local attempt=1
            local wait_time=2
            
            echo "Checking PostgreSQL readiness..."
            
            while [ $attempt -le $max_attempts ]; do
              if docker exec cinemaabyss-postgres pg_isready -U postgres > /dev/null 2>&1; then
                echo "✅ PostgreSQL is ready!"
                return 0
              fi
              
              echo "⏳ Attempt $attempt/$max_attempts: PostgreSQL not ready yet, waiting ${wait_time}s..."
              sleep $wait_time
              attempt=$((attempt + 1))
            done
            
            echo "❌ PostgreSQL failed to become ready"
            return 1
          }
          
          # Ждем и проверяем PostgreSQL
          echo "Waiting for PostgreSQL to be ready..."
          sleep 5
          check_postgres || (echo "PostgreSQL logs:" && docker logs cinemaabyss-postgres --tail 50 && exit 1)
          
          # Дополнительное ожидание для инициализации БД
          echo "Waiting for database initialization..."
          sleep 15
          
          # Ждем Kafka и Zookeeper
          echo "Waiting for Kafka and Zookeeper..."
          sleep 20
          
          # Проверяем health checks сервисов
          check_health "http://localhost:8080/health" "Monolith" || {
            echo "Monolith logs:"
            docker logs cinemaabyss-monolith --tail 50
            exit 1
          }
          check_health "http://localhost:8081/api/movies/health" "Movies Service" || {
            echo "Movies Service logs:"
            docker logs cinemaabyss-movies-service --tail 50
            exit 1
          }
          check_health "http://localhost:8082/api/events/health" "Events Service" || {
            echo "Events Service logs:"
            docker logs cinemaabyss-events-service --tail 50
            exit 1
          }
          check_health "http://localhost:8000/health" "Proxy Service" || {
            echo "Proxy Service logs:"
            docker logs cinemaabyss-proxy-service --tail 50
            exit 1
          }
          
          echo "✅ All services are ready!"
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: tests/postman/package-lock.json
      
      - name: Install Newman and dependencies
        working-directory: tests/postman
        run: npm install
      
      - name: Run API tests
        working-directory: tests/postman
        run: |
          # Build the Docker image
          docker build -t cinemaabyss-api-tests .
          
          # Run the tests in Docker
          docker run --network=cinemaabyss-network -v "$(pwd)/reports:/app/reports" cinemaabyss-api-tests
        
      
      - name: Stop services
        if: always()
        run: docker compose down